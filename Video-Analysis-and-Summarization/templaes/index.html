
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: transparent;
    }

    .header {
        padding: 22px 28px;
        border-radius: 18px;
        background: linear-gradient(110deg, #ffe5f0, #e4f3ff);
        border: 1px solid #f4dce9;
        box-shadow: 0 5px 18px rgba(100, 110, 150, 0.08);
    }

    .topline {
        color: #a45b83;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 9px;
    }

    h1 {
        color: #354765;
        font-size: 29px;
        margin: 0 0 8px;
    }

    .subtitle {
        color: #64748b;
        font-size: 14px;
        margin: 0;
    }

    .tag {
        display: inline-block;
        margin-top: 15px;
        padding: 6px 12px;
        border-radius: 20px;
        color: #75516d;
        background: rgba(255,255,255,0.7);
        font-size: 11px;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="topline">Generative AI Laboratory</div>
        <h1>🎬 Video Intelligence</h1>
        <p class="subtitle">
            Understand video content using spatiotemporal transformers and AI summarization.
        </p>
        <span class="tag">VIDEO ANALYSIS</span>
    </div>
</body>
</html>
